name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Ubuntu verification tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Bootstrap managed runtime (Unix)
        if: runner.os != 'Windows'
        run: ./tools/setup.sh

      - name: Bootstrap managed runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tools\setup.ps1

      - name: Run Python tests (Unix)
        if: runner.os != 'Windows'
        run: .venv/bin/python -m pytest tests/ -v

      - name: Run Python tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest tests/ -v

      - name: Run doctor and native CLI smoke (Unix)
        if: runner.os != 'Windows'
        run: |
          .venv/bin/python tools/doctor.py
          .venv/bin/python tools/device_smoke.py
          .venv/bin/python -c "from pathlib import Path; import subprocess; from perfetto_tools.artifacts import verified_trace_processor; subprocess.run([str(verified_trace_processor(Path.cwd())), '--version'], check=True)"
          ./capture/capture.sh --list-configs
          .venv/bin/python official/record_android_trace --help >/dev/null

      - name: Run doctor and native CLI smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe tools/doctor.py
          .\.venv\Scripts\python.exe tools/device_smoke.py
          .\.venv\Scripts\python.exe -c "from pathlib import Path; import subprocess; from perfetto_tools.artifacts import verified_trace_processor; subprocess.run([str(verified_trace_processor(Path.cwd())), '--version'], check=True)"
          .\capture\capture.bat --list-configs
          .\.venv\Scripts\python.exe official/record_android_trace --help > $null

      - name: Verify shell and all artifact hashes
        if: runner.os == 'Linux'
        run: |
          git ls-files -z '*.sh' | xargs -0 bash -n
          git ls-files -z '*.sh' | xargs -0 shellcheck
          awk '!/^#/ && NF' tools/sha256.txt | sha256sum --check -
